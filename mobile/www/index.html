<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081957" />
    <title>자재GO</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: #f4f6f8;
        color: #081957;
        font-family: "Noto Sans KR", Arial, sans-serif;
      }

      main {
        width: min(100%, 400px);
        text-align: center;
      }

      img {
        width: 112px;
        height: 112px;
        border-radius: 24px;
      }

      h1 {
        margin: 22px 0 8px;
        font-size: 25px;
      }

      p {
        margin: 0;
        color: #667081;
        font-size: 15px;
        line-height: 1.65;
      }

      a {
        display: grid;
        min-height: 48px;
        margin-top: 24px;
        border-radius: 6px;
        background: #081957;
        color: #ffffff;
        font-weight: 800;
        place-items: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="app-icon.png" alt="자재GO" />
      <h1>자재GO</h1>
      <p>온라인 연결 후 최신 상품과 회원 정보를 확인할 수 있습니다.</p>
      <a href="https://jajaego.com/#homePage">자재GO 연결</a>
    </main>
  </body>
</html>

limit_req_zone $binary_remote_addr zone=jajaego_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=jajaego_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=jajaego_ai:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=jajaego_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name jajaego.example.com;

    server_tokens off;
    client_max_body_size 40m;

    access_log /var/log/nginx/jajaego.access.log;
    error_log /var/log/nginx/jajaego.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/(social-auth|admin/login|login$|signup-requests) {
        limit_req zone=jajaego_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:4173;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/(render|tile-match|proposal-ppt) {
        limit_req zone=jajaego_ai burst=4 nodelay;
        proxy_pass http://127.0.0.1:4173;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 420s;
        proxy_read_timeout 420s;
    }

    location /api/ {
        limit_req zone=jajaego_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4173;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4173;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        limit_conn jajaego_conn 30;
        proxy_pass http://127.0.0.1:4173;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
